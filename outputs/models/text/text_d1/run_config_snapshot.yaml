dataset:
  jsonl_path: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/outputs/cases.jsonl
  limit: null
  chunk_size: 4096
outputs:
  root: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/outputs
splits:
  seed: 42
  train: 0.7
  val: 0.15
  test: 0.15
  force_rebuild: false
labels:
  source_priority:
  - decision
  - outcome.winner
  - outcome.label
  canonical_order:
  - for_appellant
  - against_appellant
  - dismissed
  - delayed
  - other
  drop_unknown: true
  default_label: null
  exact_map:
    for_appellant:
    - for_appellant
    - petitioner
    - petitioner_applicant
    - applicant
    - appellant
    - accused
    - complainant
    - claimant
    - assessee
    - bail_granted
    - anticipatory_bail_granted
    - allowed
    - granted
    against_appellant:
    - against_appellant
    - respondent
    - respondent_state_defendant
    - state
    - prosecution
    - defendant
    - union_of_india
    - bail_rejected
    - anticipatory_bail_rejected
    - rejected
    - refused
    - denied
    dismissed:
    - dismissed
    - petition_dismissed
    - appeal_dismissed
    - complaint_dismissed
    - quashed
    - disposed
    delayed:
    - delayed
    - adjourned
    - deferred
    - postponed
    - stand_over
    other:
    - other
  contains_map:
    for_appellant:
    - in favor of petitioner
    - in favour of petitioner
    - in favor of appellant
    - bail granted
    - petition allowed
    - appeal allowed
    - released on bail
    against_appellant:
    - not inclined to grant
    - bail rejected
    - prayer rejected
    - petition rejected
    - anticipatory bail rejected
    - against petitioner
    - in favor of state
    dismissed:
    - dismissed
    - quashed
    - disposed
    - set aside
    delayed:
    - adjourned
    - deferred
    - postponed
    - stand over
eda:
  top_k: 20
  hist_bins: 30
baselines:
  text_mode: facts_plus_args
  tfidf:
    max_features: 50000
    ngram_range:
    - 1
    - 2
    min_df: 1
    max_df: 0.95
    sublinear_tf: true
  logreg:
    max_iter: 3000
    C: 1.0
    class_weight: balanced
    n_jobs: 4
    solver: lbfgs
    multi_class: auto
text_model:
  run_name: text_d1
  text_mode: facts_plus_args
  cache_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/outputs/models/text/embeddings_cache
  embedder:
    backend: sentence_transformers
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 32
    max_length: 512
    device: null
  classifier:
    type: logreg
    max_iter: 3000
    C: 1.0
    class_weight: balanced
    n_jobs: 4
    solver: lbfgs
    multi_class: auto
gnn:
  run_name: gnn_default
  use_pyg: true
  add_case_case_edges: true
  hidden_dim: 128
  dropout: 0.2
  epochs: 100
  lr: 0.001
  weight_decay: 1.0e-05
  use_cuda_if_available: true
  fallback_max_iter: 2000
  fallback_C: 1.0
  fallback_n_jobs: 4
rag:
  run_name: rag_default
  use_faiss: true
  query_text_mode: input_text_only
  top_k: 5
  snippet_max_chars: 1200
  faiss:
    index_type: flat_ip
  llm:
    enabled: false
    endpoint_url: http://127.0.0.1:11434/api/generate
    model_name: qwen2.5:7b-instruct
    timeout_sec: 120
    temperature: 0.0
  prompt_fields:
  - case_id
  - court
  - year
  - facts_text
  - arguments_petitioner
  - arguments_respondent
  - outcome.label
  - outcome.winner
