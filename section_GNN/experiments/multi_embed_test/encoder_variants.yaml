default_variants:
  # Keep the default comparison small: hashing baseline vs BGE-M3 only.
  - hashing
  - bge_m3

variants:
  hashing:
    description: Deterministic signed hashing baseline.
    features:
      text_encoder:
        backend: hashing
        dim: 384
        batch_size: 32
        max_length: 512
      fallback_text_encoder:
        backend: hashing
        dim: 384

  bge_m3:
    description: BGE-M3 multilingual dense encoder.
    features:
      text_encoder:
        backend: sentence_transformers
        model_name: BAAI/bge-m3
        # Use CUDA explicitly and let SentenceTransformers split work across all visible GPUs.
        batch_size: 16
        max_length: 512
        device: cuda
        multi_process: true
      fallback_text_encoder:
        backend: hashing
        dim: 384

  inlegalbert:
    description: InLegalBERT domain-specific encoder for Indian legal text.
    features:
      text_encoder:
        backend: sentence_transformers
        model_name: law-ai/InLegalBERT
        batch_size: 64
        max_length: 512
        device: cuda
        multi_process: true
      fallback_text_encoder:
        backend: hashing
        dim: 384

  incaselawbert:
    description: InCaseLawBERT domain-specific encoder for Indian case law.
    features:
      text_encoder:
        backend: sentence_transformers
        model_name: law-ai/InCaseLawBERT
        batch_size: 64
        max_length: 512
        device: cuda
        multi_process: true
      fallback_text_encoder:
        backend: hashing
        dim: 384

  e5_large_v2:
    description: E5-large-v2 general-purpose dense encoder (intfloat).
    features:
      text_encoder:
        backend: sentence_transformers
        model_name: intfloat/e5-large-v2
        batch_size: 16
        max_length: 512
        device: cuda
        multi_process: true
      fallback_text_encoder:
        backend: hashing
        dim: 384

  legal_longformer:
    description: Longformer-based legal encoder for longer-context legal text.
    features:
      text_encoder:
        backend: hf_encoder
        model_name: joelniklaus/legal-xlm-longformer-base
        pooling: mean
        batch_size: 2
        max_length: 512
        device: null
      fallback_text_encoder:
        backend: hashing
        dim: 384
