project:
  name: motor_accidents_no_names_v2
  seed: 42

paths:
  raw_json_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/DATA_SET_BUILDER_AND_EXPLORER/Timeline_Maker/motor_accidents_timed_mistral
  processed_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/processed
  cleaned_case_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/processed/cleaned_cases
  normalized_entity_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/processed/normalized_entities
  embeddings_cache_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/embeddings_cache
  graph_cache_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/graph_cache
  audits_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/data/timed_bucket_runs/motor_accidents_timed_mistral/audits
  outputs_dir: /scratch/ziv_baretto/Thesis_Ziv/Capstone-Thesis-/section_GNN/outputs/timed_bucket_runs/motor_accidents_timed_mistral

data:
  file_glob: "*__*.json"
  limit: null
  sample_case_ids: []

preprocessing:
  label_field: case_outcome_score
  label_value_map:
    "-1": "-1"
    "0": "-1"
    "1": "1"
  skip_missing_or_unmapped_labels: true
  use_preamble_end_offset: true
  preamble_roles: [PREAMBLE]
  facts_roles: [FAC]
  petitioner_argument_roles: [ARG_PETITIONER]
  respondent_argument_roles: [ARG_RESPONDENT]
  other_argument_roles: [PRE_RELIED, PRE_NOT_RELIED, STA]
  dropped_sentence_roles: [ANALYSIS, ISSUE, NONE, RATIO, RLC, RPC]
  mask_token: "[LEAKAGE_MASK]"
  leakage_phrases:
    - petition stands disposed of
    - writ petition stands disposed of
    - appeal is allowed
    - appeal allowed
    - petition is allowed
    - petition allowed
    - appeal dismissed
    - petition dismissed
    - writ petition dismissed
    - matter remanded
    - set aside
    - quashed
    - liberty granted
    - tribunal shall entertain
    - consequently, connected miscellaneous petition is closed
    - without rejecting it on the ground of limitation

graph:
  build_mode: full_star_global
  use_to_undirected: true
  # Preamble section dropped — contains judge/party/court identity text
  include_sections:
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
  # v2 fix: party-argument sections now contribute to the case-node embedding
  case_text_sections:
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
  # Name-bearing node types removed: preamble, court, judge, petitioner, respondent,
  # petitioner_lawyer, defence_lawyer, lawyer
  include_node_types:
    - case
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
    - statute
    - provision
    - precedent
  shareable_node_types: []
  share_party_nodes: false
  cache_name: case_star_global_graph_motor_accidents_no_names_v2.reasoning_focused.pt
  debug_sample_size: 3

features:
  text_encoder:
    backend: sentence_transformers
    model_name: BAAI/bge-m3
    batch_size: 32
    max_length: 512
    device: cuda
    multi_process: true
  fallback_text_encoder:
    backend: hashing
    dim: 384
  # Name-related scalars removed: respondent_count, judge_count, lawyer_count, preamble_length
  case_scalar_names:
    - statute_count
    - provision_count
    - precedent_count
    - facts_length
    - arguments_length
    - case_year
    - petition_type_known
    - petition_type_hash
  entity_scalar_names:
    - mention_count
    - first_seen_preamble
    - first_seen_facts
    - first_seen_arguments
    - seen_in_arguments
    - seen_in_preamble
    - local_case_frequency
    - degree
    - global_case_frequency
    - is_shared_node

labels:
  task_mode: binary
  drop_procedural: false
  binary_map:
    "-1": "-1"
    "1": "1"
  class_order_binary:
    - "-1"
    - "1"

splits:
  mode: random
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  stratify: true
  random_state: 42

model:
  architecture: hgt
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.25
  mlp_hidden_dim: 128

training:
  epochs: 90
  lr: 0.001
  weight_decay: 0.00001
  use_early_stopping: true
  early_stopping_patience: 20
  log_every: 5
  class_weight: balanced
  repeat_runs: 1
  seed_stride: 1
  lr_scheduler: reduce_on_plateau
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 8
  lr_min: 0.000001
