project:
  name: case_star_global_authority_prediction_sanity
  seed: 42

paths:
  raw_json_dir: ../OpenNyai/outputs/current_output/combined_mistral24b_case_outcomes/augmented_jsons
  processed_dir: ../GNN/data/processed
  cleaned_case_dir: ../GNN/data/processed/cleaned_cases
  normalized_entity_dir: ../GNN/data/processed/normalized_entities
  embeddings_cache_dir: ../GNN/data/embeddings_cache
  graph_cache_dir: ../GNN/data/graph_cache
  audits_dir: ../GNN/data/audits
  outputs_dir: ../GNN/outputs

data:
  file_glob: "*.json"
  limit: null
  sample_case_ids: []

preprocessing:
  allowed_summary_fields: [PREAMBLE, facts, arguments]
  fallback_to_annotation_text: true
  allowed_annotation_sections: [PREAMBLE, facts, arguments, null]
  forbidden_annotation_sections: [decision, ANALYSIS, issue]
  forbidden_top_level_fields:
    [case_outcome_label, case_outcome_score, llm_case_outcome, decision_text, rpc_texts, short_explanation, raw_model_response]
  forbidden_annotation_labels: [RPC, RLC]
  mask_token: "[LEAKAGE_MASK]"
  leakage_phrases:
    - petition stands disposed of
    - writ petition stands disposed of
    - appeal is allowed
    - appeal allowed
    - petition is allowed
    - petition allowed
    - appeal dismissed
    - petition dismissed
    - writ petition dismissed
    - matter remanded
    - set aside
    - quashed
    - liberty granted
    - tribunal shall entertain
    - consequently, connected miscellaneous petition is closed
    - without rejecting it on the ground of limitation
  retain_raw_preamble_fallback: true

graph:
  build_mode: full_star_global
  include_reverse_edges: true
  use_to_undirected: true
  include_sections: [preamble, facts, arguments]
  include_node_types:
    [case, preamble, facts, arguments, petitioner, respondent, court, judge, lawyer, statute, provision, precedent, org, gpe, date, case_number]
  shareable_node_types: [court, judge, lawyer, statute, provision, precedent, org, gpe, date, case_number]
  share_party_nodes: false
  cache_name: case_star_global_graph_sanity.pt
  debug_sample_size: 3

features:
  text_encoder:
    backend: hashing
    dim: 384
    batch_size: 64
    max_length: 512
  fallback_text_encoder:
    backend: hashing
    dim: 384
  case_scalar_names:
    [respondent_count, judge_count, lawyer_count, statute_count, provision_count, precedent_count, preamble_length, facts_length, arguments_length, case_year, petition_type_known, petition_type_hash]
  entity_scalar_names:
    [mention_count, first_seen_preamble, first_seen_facts, first_seen_arguments, seen_in_arguments, seen_in_preamble, local_case_frequency, global_case_frequency, degree, is_shared_node]

labels:
  task_mode: binary
  drop_procedural: true
  binary_map:
    appellant_won: win
    appellant_lost: lose
    postponed_or_procedural: null
  multiclass_map:
    appellant_won: win
    appellant_lost: lose
    postponed_or_procedural: procedural
  class_order_binary: [lose, win]
  class_order_multiclass: [lose, procedural, win]

splits:
  mode: random
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  stratify: true
  random_state: 42

model:
  architecture: hgt
  hidden_dim: 96
  num_layers: 2
  num_heads: 4
  dropout: 0.2
  mlp_hidden_dim: 96

training:
  epochs: 8
  lr: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 4
  log_every: 1
  class_weight: balanced

ablation:
  variants: {}
