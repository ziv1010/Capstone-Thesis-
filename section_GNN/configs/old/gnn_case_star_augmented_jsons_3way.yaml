project:
  name: case_star_augmented_jsons_3way_section
  seed: 42

paths:
  raw_json_dir: data/input/augmented_jsons
  processed_dir: data/augmented_jsons_3way/processed
  cleaned_case_dir: data/augmented_jsons_3way/processed/cleaned_cases
  normalized_entity_dir: data/augmented_jsons_3way/processed/normalized_entities
  embeddings_cache_dir: data/augmented_jsons_3way/embeddings_cache
  graph_cache_dir: data/augmented_jsons_3way/graph_cache
  audits_dir: data/augmented_jsons_3way/audits
  outputs_dir: outputs/augmented_jsons_3way

data:
  file_glob: "*.json"
  limit: null
  sample_case_ids: []

preprocessing:
  allowed_summary_fields:
    - PREAMBLE
    - facts
    - arguments
  fallback_to_annotation_text: true
  allowed_annotation_sections:
    - PREAMBLE
    - facts
    - arguments
    - null
  forbidden_annotation_sections:
    - decision
    - ANALYSIS
    - issue
  forbidden_top_level_fields:
    - case_outcome_label
    - case_outcome_score
    - llm_case_outcome
    - decision_text
    - rpc_texts
    - short_explanation
    - raw_model_response
  forbidden_annotation_labels:
    - RPC
    - RLC
  mask_token: "[LEAKAGE_MASK]"
  leakage_phrases:
    - petition stands disposed of
    - writ petition stands disposed of
    - appeal is allowed
    - appeal allowed
    - petition is allowed
    - petition allowed
    - appeal dismissed
    - petition dismissed
    - writ petition dismissed
    - matter remanded
    - set aside
    - quashed
    - liberty granted
    - tribunal shall entertain
    - consequently, connected miscellaneous petition is closed
    - without rejecting it on the ground of limitation
  retain_raw_preamble_fallback: true
  derive_role_argument_sections: true

graph:
  build_mode: full_star_global
  include_reverse_edges: true
  use_to_undirected: true
  include_sections:
    - preamble
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
  case_text_sections:
    - preamble
    - facts
    - arguments
  include_node_types:
    - case
    - preamble
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
    - petitioner
    - respondent
    - court
    - judge
    - petitioner_lawyer
    - defence_lawyer
    - lawyer
    - statute
    - provision
    - precedent
    - org
    - gpe
    - date
    - case_number
  shareable_node_types:
    - court
    - judge
    - petitioner_lawyer
    - defence_lawyer
    - lawyer
    - statute
    - provision
    - precedent
    - org
    - gpe
    - date
    - case_number
  share_party_nodes: false
  cache_name: case_star_global_graph_augmented_jsons_3way.pt
  debug_sample_size: 3

# features:
#   text_encoder:
#     backend: sentence_transformers
#     model_name: sentence-transformers/all-MiniLM-L6-v2
#     pooling: mean
#     batch_size: 16
#     max_length: 512
#     device: null
features:
  text_encoder:
    backend: hf_encoder                # <-- Changed from sentence_transformers
    model_name: saibo/legal-roberta-base # <-- Or any other RoBERTa variant on HF HUB
    pooling: mean                      # <-- 'mean' or 'cls' depending on what representation you want
    batch_size: 8                      # <-- Tip: RoBERTa is heavier, reduce batch size if you hit Out Of Memory errors
    max_length: 512 
    device: null
  fallback_text_encoder:
    backend: hashing
    dim: 384
  case_scalar_names:
    - respondent_count
    - judge_count
    - lawyer_count
    - statute_count
    - provision_count
    - precedent_count
    - preamble_length
    - facts_length
    - arguments_length
    - case_year
    - petition_type_known
    - petition_type_hash
  entity_scalar_names:
    - mention_count
    - first_seen_preamble
    - first_seen_facts
    - first_seen_arguments
    - seen_in_arguments
    - seen_in_preamble
    - local_case_frequency
    - global_case_frequency
    - degree
    - is_shared_node

labels:
  task_mode: multiclass
  drop_procedural: false
  binary_map:
    appellant_won: "1"
    appellant_lost: "-1"
    postponed_or_procedural: null
  multiclass_map:
    appellant_won: "1"
    appellant_lost: "-1"
    postponed_or_procedural: "0"
  class_order_binary:
    - "-1"
    - "1"
  class_order_multiclass:
    - "-1"
    - "0"
    - "1"

splits:
  mode: random
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  stratify: true
  random_state: 42

model:
  architecture: hgt
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.25
  mlp_hidden_dim: 128

training:
  epochs: 60
  lr: 0.001
  weight_decay: 0.00001
  use_early_stopping: false
  early_stopping_patience: 15
  log_every: 5
  class_weight: balanced
  repeat_runs: 1
  seed_stride: 1

ablation:
  variants:
    text_only:
      graph:
        build_mode: text_only
        include_node_types:
          - case
          - preamble
          - facts
          - arguments
    star_only:
      graph:
        build_mode: local_star_only
        shareable_node_types: []
    full_star_global: {}
    without_judge:
      graph:
        include_node_types:
          - case
          - preamble
          - facts
          - arguments
          - petitioner
          - respondent
          - court
          - lawyer
          - statute
          - provision
          - precedent
          - org
          - gpe
          - date
          - case_number
        shareable_node_types:
          - court
          - lawyer
          - statute
          - provision
          - precedent
          - org
          - gpe
          - date
          - case_number
    without_statute_provision:
      graph:
        include_node_types:
          - case
          - preamble
          - facts
          - arguments
          - petitioner
          - respondent
          - court
          - judge
          - lawyer
          - precedent
          - org
          - gpe
          - date
          - case_number
        shareable_node_types:
          - court
          - judge
          - lawyer
          - precedent
          - org
          - gpe
          - date
          - case_number
