graph:
  build_mode: full_star_global
  include_reverse_edges: true
  use_to_undirected: true
  include_sections:
    - preamble
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
  include_node_types:
    - case
    - preamble
    - facts
    - arguments
    - petitioner_arguments
    - respondent_arguments
    - other_lawyer_arguments
    - petitioner
    - respondent
    - court
    - judge
    - petitioner_lawyer
    - defence_lawyer
    - lawyer
    - statute
    - provision
    - precedent
  shareable_node_types:
    - court
    - judge
    - petitioner_lawyer
    - defence_lawyer
    - lawyer
    - statute
    - provision
    - precedent
  share_party_nodes: false
  cache_name: reasoning_focused_case_star_graph.pt
  debug_sample_size: 3

features:
  text_encoder:
    backend: sentence_transformers
    model_name: BAAI/bge-m3
    batch_size: 16
    max_length: 512
    device: cuda
    multi_process: true
  fallback_text_encoder:
    backend: hashing
    dim: 384
