<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Merger Visualiser</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3250;
  --accent:#6c8fff; --green:#34d399; --yellow:#fbbf24; --red:#f87171;
  --blue:#60a5fa; --purple:#c084fc; --orange:#fb923c;
  --text:#e2e8f0; --muted:#64748b;
  --s0:#fbbf24; --s1:#60a5fa; --s2:#c084fc; --s3:#fb923c; --s4:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:700;color:var(--accent)}
header .sub{color:var(--muted);font-size:12px}
.stats-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;text-align:center;min-width:90px}
.stat .n{font-size:18px;font-weight:700}.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.body{display:flex;flex:1;overflow:hidden}
.left{width:400px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.controls{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.controls input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;font-size:12px;width:100%;outline:none}
.controls input:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.fb{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;transition:.12s}
.fb:hover{color:var(--text)}.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.case-list{flex:1;overflow-y:auto;padding:8px}
.case-list::-webkit-scrollbar{width:4px}.case-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.ci{padding:9px 11px;border-radius:7px;border:1px solid transparent;cursor:pointer;margin-bottom:5px;transition:.12s;background:var(--surface)}
.ci:hover{border-color:var(--border);background:var(--surface2)}.ci.active{border-color:var(--accent);background:#1a2240}.ci.hidden{display:none}
.ci-top{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.ci-name{font-size:11.5px;font-weight:600;line-height:1.4;flex:1;word-break:break-word}
.ci-pill{font-size:10px;font-weight:600;border-radius:20px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.pill-merged{background:#1a2a4a;color:var(--blue)}.pill-ok{background:#14412e;color:var(--green)}
.pill-deduped{background:#3d2e0d;color:var(--yellow)}.pill-single{background:var(--surface2);color:var(--muted)}
.ci-tl{display:flex;align-items:center;flex-wrap:wrap;row-gap:3px}
.tl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tl-lbl{font-size:10px;border-radius:3px;padding:1px 5px;margin-left:2px}
.tl-lbl.latest{background:#1a2240;color:var(--accent)}.tl-lbl.appended{background:#3d2e0d;color:var(--yellow)}
.tl-lbl.contained{background:#14412e;color:var(--green)}.tl-lbl.plain{background:var(--surface2);color:var(--muted)}
.tl-arr{color:var(--border);font-size:10px;padding:0 2px}
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.right-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:8px}
.right-placeholder .big{font-size:40px}
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.detail-header h2{font-size:13px;font-weight:700;word-break:break-word;line-height:1.5}
.dmeta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;padding:0 18px}
.tab{padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow:hidden;display:none}.tab-content.active{display:flex;flex-direction:column}
.overview{padding:18px;overflow-y:auto;flex:1}
.ov-section{margin-bottom:18px}
.ov-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:600}
.file-row{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:6px;background:var(--surface2);margin-bottom:4px;font-size:11.5px;word-break:break-all;border:1px solid var(--border)}
.fd{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.badge{font-size:10px;font-weight:600;border-radius:20px;padding:2px 7px;display:inline-block;white-space:nowrap}
.badge-blue{background:#1e3a5f;color:var(--blue)}.badge-green{background:#14412e;color:var(--green)}.badge-yellow{background:#3d2e0d;color:var(--yellow)}
.note-box{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:7px;padding:10px 12px;line-height:1.7;border:1px solid var(--border)}
.note-box strong{color:var(--text)}
.text-viewer{flex:1;overflow-y:auto}
.text-viewer::-webkit-scrollbar{width:6px}.text-viewer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.error-msg{padding:18px;color:var(--red);font-size:12px;line-height:1.7}
/* Section blocks */
.sec-block{border-bottom:1px solid var(--border)}
.sec-hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:7px 18px;font-size:11.5px;font-weight:600;border-bottom:1px solid}
.sec-text{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:11px;line-height:1.75;padding:14px 18px 20px;white-space:pre-wrap;word-break:break-word;color:#cdd6f4}
/* 5 colour slots */
.s0 .sec-hdr{background:#1e1a00;color:var(--s0);border-color:#3a3200}.s0 .sec-text{background:#0d0b00}
.s1 .sec-hdr{background:#001429;color:var(--s1);border-color:#002a52}.s1 .sec-text{background:#000d1a}
.s2 .sec-hdr{background:#1a0d2e;color:var(--s2);border-color:#320d52}.s2 .sec-text{background:#100822}
.s3 .sec-hdr{background:#1e1000;color:var(--s3);border-color:#3d2200}.s3 .sec-text{background:#0f0800}
.s4 .sec-hdr{background:#002918;color:var(--s4);border-color:#00522e}.s4 .sec-text{background:#001510}
/* JSON viewer */
.json-viewer{flex:1;overflow-y:auto;padding:16px 18px;font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:11px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.json-viewer::-webkit-scrollbar{width:6px}.json-viewer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.jk{color:#89b4fa}.js{color:#a6e3a1}.jn{color:#fab387}.jb{color:#cba6f7}
/* Legend */
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:7px 18px;border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px}
.legend-dot{width:9px;height:9px;border-radius:50%}
</style>
</head>
<body>
<header>
  <div>
    <h1>Case Merger Visualiser</h1>
    <div class="sub">Select a case on the left · inspect merged text with colour-coded hearing sections</div>
  </div>
</header>
<div class="stats-bar" id="statsBar"></div>
<div class="body">
  <div class="left">
    <div class="controls">
      <input type="text" id="search" placeholder="Search case name…" oninput="applyFilters()">
      <div class="filter-row">
        <button class="fb active" onclick="setFilter('all',this)">All</button>
        <button class="fb" onclick="setFilter('merged',this)">Merged</button>
        <button class="fb" onclick="setFilter('ok',this)">Contained</button>
        <button class="fb" onclick="setFilter('deduped',this)">Deduped</button>
      </div>
    </div>
    <div class="case-list" id="caseList"></div>
  </div>
  <div class="right" id="rightPanel">
    <div class="right-placeholder">
      <div class="big">⚖</div>
      <div>Select a case to view details</div>
    </div>
  </div>
</div>

const OUTPUT_BASE = 'output_merged/';
const SC = ['var(--s0)','var(--s1)','var(--s2)','var(--s3)','var(--s4)'];

let activeFilter='all';

function fmt(d){const[day,m,y]=d.split('_');return `${day} ${m.slice(0,3)} ${y}`;}
function humanCase(r){return r.replace(/_/g,' ');}
function splitVs(n){const i=n.toLowerCase().indexOf(' vs ');return i<0?[n,null]:[n.slice(0,i),n.slice(i+4)];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildCases(){
  const all=[];
  for(const mc of REPORT.multi_date_cases){
    all.push({type:(mc.appended_from&&mc.appended_from.length>0)?'merged':'ok',name:humanCase(mc.case),raw:mc});
  }
  for(const dc of REPORT.same_date_duplicates) all.push({type:'deduped',name:humanCase(dc.case),raw:dc});
  return all;
}
const CASES=buildCases();

function renderStats(){
  const multi=REPORT.multi_date_cases.length;
  const merged=REPORT.multi_date_cases.filter(m=>m.appended_from&&m.appended_from.length>0).length;
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><div class="n" style="color:var(--text)">${REPORT.total_files}</div><div class="l">Files</div></div>
    <div class="stat"><div class="n" style="color:var(--text)">${REPORT.total_case_groups}</div><div class="l">Groups</div></div>
    <div class="stat"><div class="n" style="color:var(--blue)">${multi}</div><div class="l">Multi-date</div></div>
    <div class="stat"><div class="n" style="color:var(--yellow)">${merged}</div><div class="l">Merged</div></div>
    <div class="stat"><div class="n" style="color:var(--green)">${multi-merged}</div><div class="l">Contained</div></div>
    <div class="stat"><div class="n" style="color:var(--yellow)">${REPORT.same_date_duplicates.length}</div><div class="l">Deduped</div></div>
    <div class="stat"><div class="n" style="color:var(--muted)">${REPORT.single_file_cases}</div><div class="l">Single</div></div>`;
}

function renderCaseList(){
  const list=document.getElementById('caseList');
  let html='';
  for(let i=0;i<CASES.length;i++){
    const item=CASES[i];
    const[pet,res]=splitVs(item.name);
    const pillCls={merged:'pill-merged',ok:'pill-ok',deduped:'pill-deduped'}[item.type];
    const pillText={merged:'Merged',ok:'Contained',deduped:'Deduped'}[item.type];
    const icon={merged:'🔗',ok:'✓',deduped:'⊕'}[item.type];
    let tlHtml='';
    if(item.type==='merged'||item.type==='ok'){
      const mc=item.raw;
      const nodes=mc.dates.map((d,di)=>{
        const isLatest=di===mc.dates.length-1;
        const cp=mc.containment_per_file?mc.containment_per_file.find(c=>c.date===d):null;
        const wasApp=mc.appended_from&&mc.appended_from.some(f=>f.includes(d));
        let cls='plain',dotC='var(--muted)';
        if(isLatest){cls='latest';dotC='var(--accent)';}
        else if(wasApp){cls='appended';dotC='var(--yellow)';}
        else if(cp&&cp.contained_in_latest){cls='contained';dotC='var(--green)';}
        return `<div style="display:flex;align-items:center"><div class="tl-dot" style="background:${dotC}"></div><div class="tl-lbl ${cls}" style="margin-left:2px">${fmt(d)}</div></div>`;
      });
      tlHtml=`<div class="ci-tl">${nodes.join('<span class="tl-arr">→</span>')}</div>`;
    } else {
      tlHtml=`<div style="font-size:10px;color:var(--muted)">${fmt(item.raw.date)} · ${item.raw.files.length} duplicates</div>`;
    }
    html+=`<div class="ci" data-idx="${i}" data-type="${item.type}" data-name="${item.name.toLowerCase()}" onclick="selectCase(${i})">
      <div class="ci-top"><span style="font-size:14px">${icon}</span><div class="ci-name">${pet}${res?`<span style="color:var(--muted);font-weight:400"> vs </span>${res}`:''}</div><span class="ci-pill ${pillCls}">${pillText}</span></div>
      ${tlHtml}
    </div>`;
  }
  list.innerHTML=html;
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.ci').forEach(el=>{
    const ok=(activeFilter==='all'||el.dataset.type===activeFilter)&&(!q||el.dataset.name.includes(q));
    el.classList.toggle('hidden',!ok);
  });
}

function selectCase(idx){
  document.querySelectorAll('.ci').forEach(el=>el.classList.toggle('active',+el.dataset.idx===idx));
  renderRight(CASES[idx]);
}

function renderRight(item){
  const mc=item.raw;
  const outFile=mc.output||'';
  const isMerged=item.type==='merged';
  const isOk=item.type==='ok';
  const isDeduped=item.type==='deduped';
  const textLabel=isMerged?'Merged Text':'Case Text';

  let legendHtml='';
  if(isMerged&&mc.dates){
    legendHtml='<div class="legend">';
    for(let i=0;i<mc.dates.length;i++){
      const isLast=i===mc.dates.length-1;
      const col=SC[i%5];
      const lbl=isLast?`Final (${fmt(mc.dates[i])})`:`Earlier hearing (${fmt(mc.dates[i])})`;
      legendHtml+=`<div class="legend-item"><div class="legend-dot" style="background:${col}"></div><span>${lbl}</span></div>`;
    }
    legendHtml+='</div>';
  }

  const pillMap={merged:'pill-merged',ok:'pill-ok',deduped:'pill-deduped'};
  const labelMap={merged:'Merged',ok:'Already contained',deduped:'Deduped'};

  document.getElementById('rightPanel').innerHTML=`
    <div class="detail">
      <div class="detail-header">
        <h2>${item.name}</h2>
        <div class="dmeta">
          <span class="ci-pill ${pillMap[item.type]}">${labelMap[item.type]}</span>
          ${outFile?`<span style="font-size:11px;color:var(--muted)">→ ${outFile}</span>`:''}
        </div>
      </div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
        <div class="tab" onclick="switchTab('text',this)">${textLabel}</div>
        <div class="tab" onclick="switchTab('json',this)">Raw JSON</div>
      </div>
      ${legendHtml}
      <div class="tab-content active" id="tc-overview"><div class="overview">${buildOverview(item)}</div></div>
      <div class="tab-content" id="tc-text"><div class="text-viewer" id="tvContent"><div class="loading">Click the "${textLabel}" tab to load file…</div></div></div>
      <div class="tab-content" id="tc-json"><div class="json-viewer" id="jvContent"><div class="loading">Click "Raw JSON" to load…</div></div></div>
    </div>`;

  // store for lazy loading
  const rp=document.getElementById('rightPanel');
  rp.dataset.outFile=outFile;
  rp.dataset.loaded='';
}

function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const tc=document.getElementById('tc-'+name);
  if(tc) tc.classList.add('active');
  const rp=document.getElementById('rightPanel');
  const outFile=rp.dataset.outFile;
  const loaded=rp.dataset.loaded||'';
  if(name==='text'&&!loaded.includes('t')){rp.dataset.loaded+=',t';loadText(outFile);}
  if(name==='json'&&!loaded.includes('j')){rp.dataset.loaded+=',j';loadJson(outFile);}
}

function buildOverview(item){
  const mc=item.raw;
  let html='';
  if(item.type==='merged'||item.type==='ok'){
    html+='<div class="ov-section"><h3>Hearing timeline</h3>';
    for(let i=0;i<mc.files.length;i++){
      const d=mc.dates[i];const f=mc.files[i];
      const isLatest=i===mc.files.length-1;
      const cp=mc.containment_per_file?mc.containment_per_file.find(c=>c.date===d):null;
      const wasApp=mc.appended_from&&mc.appended_from.includes(f);
      const isContained=cp&&cp.contained_in_latest;
      let dotC='var(--muted)',badge='';
      if(isLatest){dotC='var(--accent)';badge='<span class="badge badge-blue" style="margin-left:auto">final</span>';}
      else if(wasApp){dotC='var(--yellow)';badge='<span class="badge badge-yellow" style="margin-left:auto">appended</span>';}
      else if(isContained){dotC='var(--green)';badge='<span class="badge badge-green" style="margin-left:auto">contained in latest</span>';}
      html+=`<div class="file-row"><div class="fd" style="background:${dotC}"></div>
        <div style="flex:1"><div style="font-size:12px;font-weight:600">${fmt(d)}</div><div style="font-size:11px;color:var(--muted);margin-top:1px">${f}</div></div>${badge}</div>`;
    }
    html+='</div>';
    const note=item.type==='merged'
      ?`<strong>Action taken:</strong> ${mc.appended_from.length} earlier file(s) prepended. Open <em>Merged Text</em> to see colour-coded sections.`
      :`<strong>No action needed:</strong> Latest file already contained all earlier hearing content.`;
    html+=`<div class="ov-section"><h3>Merge note</h3><div class="note-box">${note}</div></div>`;
  } else {
    html+='<div class="ov-section"><h3>Duplicate files (same date)</h3>';
    for(const f of mc.files){
      const kept=f===mc.kept;
      html+=`<div class="file-row"><div class="fd" style="background:${kept?'var(--yellow)':'var(--muted)'}"></div>
        <span style="${kept?'color:var(--yellow)':''};flex:1">${f}</span>
        ${kept?'<span class="badge badge-yellow" style="margin-left:8px;flex-shrink:0">kept</span>':''}</div>`;
    }
    html+=`</div><div class="ov-section"><div class="note-box"><strong>Action taken:</strong> Kept the file with the longest text.</div></div>`;
  }
  return html;
}

async function loadText(outFile){
  const el=document.getElementById('tvContent');
  if(!el){return;}
  if(!outFile){el.innerHTML='<div class="loading">No output file.</div>';return;}
  el.innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await fetch(OUTPUT_BASE+encodeURIComponent(outFile).replace(/%20/g,' '));
    if(!res.ok) throw new Error(res.statusText);
    const data=await res.json();
    const text=data?.raw_result?.data?.text||'(no text field found)';
    const sectionOffsets=data?._section_offsets||[];
    el.innerHTML=buildColoredText(text, sectionOffsets);
  }catch(e){
    el.innerHTML=`<div class="error-msg">Could not load file: ${esc(e.message)}<br><br><small>Make sure you are serving from <code>Timeline_Maker/</code>:<br><code>python3 -m http.server 8080</code><br>then open <code>http://localhost:8080/visualiser.html</code></small></div>`;
  }
}

function buildColoredText(text, sectionOffsets){
  // Separator labels the section AFTER it: [HEARING: date — fname]
  // So: parts[0]=oldest (no preceding sep), parts[i>=1] labelled by labels[i-1]
  const SEP=/\n\n={80}\n\[(?:HEARING|FINAL DECISION): (.+?) — (.+?)\]\n={80}\n\n/g;
  const parts=[];const labels=[];  // labels[i] → date+fname of parts[i+1]
  let last=0,m;
  while((m=SEP.exec(text))!==null){
    parts.push(text.slice(last,m.index));
    labels.push({date:m[1], fname:m[2]});
    last=m.index+m[0].length;
  }
  parts.push(text.slice(last));
  if(parts.length===1) return `<div class="sec-block s4"><div class="sec-hdr">Case text</div><div class="sec-text">${esc(parts[0])}</div></div>`;

  // Use _section_offsets from JSON if available for better date labels on parts[0]
  const offsets = sectionOffsets || [];

  let html='';
  for(let i=0;i<parts.length;i++){
    const isLatest = i===parts.length-1;
    const si = i%5;
    let hdr;
    if(isLatest){
      // Label comes from labels[i-1] if available
      const lbl = i>0 ? labels[i-1] : null;
      const dateStr = lbl ? lbl.date : (offsets[i] ? offsets[i].date : '');
      hdr=`<span style="background:var(--accent);color:#fff;padding:1px 8px;border-radius:4px;font-size:11px;margin-right:6px">FINAL / LATEST DECISION</span>`
        + (dateStr?`<span style="font-weight:400;font-size:11px;color:rgba(255,255,255,.6)">${esc(dateStr.replace(/_/g,' '))}</span>`:'');
    } else if(i===0){
      // Oldest section — no preceding separator, use offsets[0] date if available
      const dateStr = offsets[0] ? offsets[0].date : '';
      hdr=`<span style="font-size:10px;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:4px;margin-right:6px">EARLIEST HEARING</span>`
        + (dateStr?`<span style="font-weight:400;font-size:11px;color:var(--muted)">${esc(dateStr.replace(/_/g,' '))}</span>`:'');
    } else {
      // Middle section — labelled by labels[i-1]
      const lbl = labels[i-1];
      hdr=`<span style="font-size:10px;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:4px;margin-right:6px">HEARING ${i+1} OF ${parts.length}</span>`
        +`<span style="font-weight:400;font-size:11px;color:var(--muted)">${esc(lbl.date.replace(/_/g,' '))} — ${esc(lbl.fname)}</span>`;
    }
    html+=`<div class="sec-block s${si}"><div class="sec-hdr">${hdr}</div><div class="sec-text">${esc(parts[i])}</div></div>`;
  }
  return html;
}

async function loadJson(outFile){
  const el=document.getElementById('jvContent');
  if(!el){return;}
  if(!outFile){el.innerHTML='<div class="loading">No file.</div>';return;}
  el.innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await fetch(OUTPUT_BASE+encodeURIComponent(outFile).replace(/%20/g,' '));
    if(!res.ok) throw new Error(res.statusText);
    const data=await res.json();
    el.innerHTML=syntaxHL(JSON.stringify(data,null,2));
  }catch(e){
    el.innerHTML=`<div class="error-msg">Could not load: ${esc(e.message)}</div>`;
  }
}

function syntaxHL(json){
  return esc(json).replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{
    if(/^"/.test(m)) return /:$/.test(m)?`<span class="jk">${m}</span>`:`<span class="js">${m}</span>`;
    if(/true|false|null/.test(m)) return `<span class="jb">${m}</span>`;
    return `<span class="jn">${m}</span>`;
  });
}
