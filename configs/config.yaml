spacy_model: en_core_web_sm
hf_home: /scratch/ziv_baretto/Thesis_Ziv/hf_cache
llm_model_name: Qwen/Qwen2.5-32B-Instruct
llm_temperature: 0.0
# Faster decode with minimal quality loss for structured JSON extraction.
# Increase only if outputs are getting truncated.
llm_max_new_tokens: 1200
llm_device_map: balanced
llm_torch_dtype: bfloat16
llm_trust_remote_code: false
llm_cuda_visible_devices: "4,5,6,7"
llm_full_document_chunking: true
llm_chunk_chars: 6000
llm_text_field_max_chars: 6000
llm_attempts_per_chunk: 6
# Lower prompt size gives a major prefill speedup on long judgments.
max_chars_to_send: 25000
ner_max_chars: 0
pdf_extraction_mode: pymupdf

# Leakage firewall: specific multi-word outcome phrases only.
# Bare words like "order", "allowed", "rejected" are intentionally excluded
# because they appear in innocent contexts throughout Indian court documents.
# The LLM prompt handles those cases semantically.
leakage_phrases:
  - the following order
  - following order is passed
  - hereby ordered
  - is hereby allowed
  - is hereby dismissed
  - is hereby rejected
  - is hereby quashed
  - is hereby granted
  - is hereby refused
  - petition is allowed
  - petition is dismissed
  - petition succeeds
  - petition fails
  - prayer is rejected
  - prayer is granted
  - prayer is dismissed
  - rule is made absolute
  - rule is discharged
  - be released on bail
  - released on bail
  - anticipatory bail is granted
  - anticipatory bail is rejected
  - anticipatory bail is refused
  - interim protection is granted
  - not inclined to grant
  - bail is rejected
  - bail is granted
  - proceedings are quashed
  - proceedings stand quashed
  - appeal is dismissed
  - appeal is allowed
  - writ is allowed
  - writ is dismissed
