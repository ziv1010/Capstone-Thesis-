spacy_model: en_core_web_sm
llm_endpoint_url: http://localhost:11434/api/generate
llm_model_name: llama3.1:8b
llm_timeout_seconds: 120
llm_temperature: 0.0
max_chars_to_send: 60000
ner_max_chars: 0
pdf_extraction_mode: pymupdf

# Leakage firewall: specific multi-word outcome phrases only.
# Bare words like "order", "allowed", "rejected" are intentionally excluded
# because they appear in innocent contexts throughout Indian court documents.
# The LLM prompt handles those cases semantically.
leakage_phrases:
  - the following order
  - following order is passed
  - hereby ordered
  - is hereby allowed
  - is hereby dismissed
  - is hereby rejected
  - is hereby quashed
  - is hereby granted
  - is hereby refused
  - petition is allowed
  - petition is dismissed
  - petition succeeds
  - petition fails
  - prayer is rejected
  - prayer is granted
  - prayer is dismissed
  - rule is made absolute
  - rule is discharged
  - be released on bail
  - released on bail
  - anticipatory bail is granted
  - anticipatory bail is rejected
  - anticipatory bail is refused
  - interim protection is granted
  - not inclined to grant
  - bail is rejected
  - bail is granted
  - proceedings are quashed
  - proceedings stand quashed
  - appeal is dismissed
  - appeal is allowed
  - writ is allowed
  - writ is dismissed
